; LoRa_RTCM_Bridge - transparent serial <-> LoRa bridge for the DX-SMART
; DX-LR30-900M22SP / DX-LR32 dev board (STM32F103C8T6 + SX1262 module).
; Carries RTCM3 corrections from the base (Raspberry Pi) to the rover's ZED-F9P.

[env:dxlr30]
platform = ststm32
board = bluepill_f103c8
framework = arduino
lib_deps =
    jgromes/RadioLib@^7.1.2
build_flags =
    ; the serial link must not drop bytes while the radio is busy
    -D SERIAL_RX_BUFFER_SIZE=1024
    -D SERIAL_TX_BUFFER_SIZE=1024
; also write firmware.hex for the vendor's mcuisp flashing tool
extra_scripts = post:make_hex.py
